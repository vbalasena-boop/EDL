name: Relais — résumé quotidien
on:
  schedule:
    - cron: '47 16 * * *' # 18 h 47 à Paris (heure d'été)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/relais/autopilote.sh resume
