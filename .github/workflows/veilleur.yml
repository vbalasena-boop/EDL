# Veilleur : détecte une story BMAD arrêtée depuis 1 h et relance Codex CLI
# automatiquement si CODEX_AUTH_JSON est configuré, sinon crée une issue.
name: Veilleur

on:
  schedule:
    - cron: "17 * * * *" # toutes les heures
  workflow_dispatch:
    inputs:
      seuil_minutes:
        description: "Seuil d'arrêt en minutes (0 = test immédiat)"
        required: false
        default: "60"

permissions:
  contents: write
  issues: write

concurrency:
  group: veilleur
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Détecter un travail arrêté
        id: detection
        env:
          GH_TOKEN: ${{ github.token }}
          SEUIL_MINUTES: ${{ inputs.seuil_minutes || '60' }}
        run: |
          set -euo pipefail
          STATUS=_bmad-output/implementation-artifacts/sprint-status.yaml

          EN_COURS=$(grep -E '^\s+[^#[:space:]][^:]*: in-progress\s*$' "$STATUS" \
            | grep -vE '^\s+epic-' | sed -E 's/^\s+([^:]+):.*/\1/' || true)

          DERNIER=$(git log -1 --format=%ct)
          MINUTES=$(( ( $(date +%s) - DERNIER ) / 60 ))
          echo "Stories en cours : ${EN_COURS:-aucune} — dernier push il y a ${MINUTES} min."

          if [ -n "$EN_COURS" ] && [ "$MINUTES" -ge "$SEUIL_MINUTES" ]; then
            echo "arrete=true"  >> "$GITHUB_OUTPUT"
            # Une seule story à la fois (première de la liste)
            CLE=$(echo "$EN_COURS" | awk 'NR==1{print $1}')
            echo "story=$CLE"   >> "$GITHUB_OUTPUT"
            echo "minutes=$MINUTES" >> "$GITHUB_OUTPUT"
          else
            echo "arrete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fermer alerte si travail repris
        if: steps.detection.outputs.arrete == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUVERTE=$(gh issue list --label veilleur --state open --json number --jq '.[0].number // empty')
          if [ -n "$OUVERTE" ]; then
            gh issue close "$OUVERTE" --comment "▶️ Le travail a repris : alerte levée."
            echo "Alerte #$OUVERTE fermée."
          else
            echo "RAS."
          fi

      - name: Vérifier si secret Codex disponible
        id: check_secret
        if: steps.detection.outputs.arrete == 'true'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -n "$CODEX_AUTH_JSON" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Relancer Codex CLI automatiquement
        id: codex
        if: steps.detection.outputs.arrete == 'true' && steps.check_secret.outputs.disponible == 'true'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ github.token }}
          STORY: ${{ steps.detection.outputs.story }}
        run: |
          set -euo pipefail

          # Restaurer l'auth Codex
          mkdir -p "$HOME/.codex"
          echo "$CODEX_AUTH_JSON" | base64 -d > "$HOME/.codex/auth.json"

          # Installer Codex CLI
          npm install -g --silent "@openai/codex@0.159.3" >/dev/null 2>&1

          if ! codex login status >/dev/null 2>&1; then
            echo "⚠️ Token Codex expiré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Trouver la fiche de la story
          FICHE=""
          while IFS= read -r F; do
            BASE=$(basename "$F" .md); BASE=${BASE#spec-}
            if [[ "$STORY" == *"$BASE" ]]; then FICHE=$F; break; fi
          done < <(git ls-files '_bmad-output/**/*.md' '_bmad-output/*.md' 2>/dev/null || true)

          if [ -z "$FICHE" ]; then
            echo "⚠️ Fiche introuvable pour $STORY."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Configurer git
          git config user.name "Veilleur (Codex)"
          git config user.email "veilleur@github-actions"

          # Choisir le modèle selon la complexité de la story
          # (gpt-5.5 = UI/CSS simples ; gpt-6-sol = moyen ; gpt-6-astra = complexe)
          MODELE="gpt-6-astra"
          if grep -qiE '(composant|css|style|page statique|ui simple)' "$FICHE" 2>/dev/null; then
            MODELE="gpt-5.5"
          elif grep -qiE '(page|intégration simple|formulaire|liste)' "$FICHE" 2>/dev/null; then
            MODELE="gpt-6-sol"
          fi

          echo "Lancement : codex exec --model $MODELE sur $FICHE"

          codex exec --model "$MODELE" --sandbox workspace-write \
            "Reprends la story BMAD. Lis le fichier '$FICHE', implémente tous les critères d'acceptation, mets à jour le statut BMAD (in-progress → review) et la section Reprise de la fiche. Respecte AGENTS.md et CLAUDE.md. Ne committe pas, ne pousse pas." \
          || {
            echo "⚠️ codex exec a échoué."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Committer et pousser si des fichiers ont changé
          if git diff --quiet && git diff --cached --quiet; then
            echo "Codex n'a rien modifié."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            git add .
            git commit -m "Veilleur : Codex reprend la story $STORY (relance auto)"
            git push
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ Story $STORY reprise et poussée par Codex."
          fi

      - name: Alerte issue (fallback si pas de secret ou token expiré)
        if: |
          steps.detection.outputs.arrete == 'true' &&
          (steps.check_secret.outputs.disponible == 'false' || steps.codex.outputs.ok == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          STORY: ${{ steps.detection.outputs.story }}
          MINUTES: ${{ steps.detection.outputs.minutes }}
          SECRET_DISPO: ${{ steps.check_secret.outputs.disponible }}
        run: |
          set -euo pipefail

          OUVERTE=$(gh issue list --label veilleur --state open --json number --jq '.[0].number // empty')
          if [ -n "$OUVERTE" ]; then
            echo "Alerte déjà ouverte (#$OUVERTE)."
            exit 0
          fi

          gh label create veilleur --color D93F0B \
            --description "Alerte : travail arrêté" --force >/dev/null

          # Trouver la fiche
          FICHE=""
          while IFS= read -r F; do
            BASE=$(basename "$F" .md); BASE=${BASE#spec-}
            if [[ "$STORY" == *"$BASE" ]]; then FICHE=$F; break; fi
          done < <(git ls-files '_bmad-output/**/*.md' '_bmad-output/*.md' 2>/dev/null || true)

          LISTE="- \`$STORY\` — fiche : \`${FICHE:-introuvable}\`"

          if [ "$SECRET_DISPO" = "false" ]; then
            SUITE="Configure \`CODEX_AUTH_JSON\` pour la relance automatique (\`bash scripts/codex-token-export.sh\`), ou ouvre **chatgpt.com/codex** et écris : **prends la suite**."
          else
            SUITE="Le token Codex a expiré. Lance \`bash scripts/codex-token-export.sh\` et mets à jour le secret \`CODEX_AUTH_JSON\` dans les Settings GitHub."
          fi

          gh issue create \
            --title "⏸️ Travail arrêté depuis ${MINUTES} min" \
            --label veilleur \
            --assignee "${{ github.repository_owner }}" \
            --body "$(printf '%s\n\n%s\n\n%s\n\n%s' \
              "Plus rien n'a été poussé depuis **${MINUTES} min** :" \
              "$LISTE" "$SUITE" \
              "_Cette issue se fermera toute seule dès que le travail reprend._")"
